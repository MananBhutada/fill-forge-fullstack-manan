version: "3.8"
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fillforge
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
  backend:
    build: ./backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/:/app
      - ./uploads:/app/uploads
      - ./filled:/app/filled
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    depends_on:
      - db
  frontend:
    build: ./frontend
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/usr/src/app
    env_file:
      - .env.example
volumes:
  db_data: